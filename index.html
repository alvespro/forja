<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://devwqshyiatvhwrudfpa.supabase.co" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fontes: carregadas sem bloquear a primeira pintura (media=print → all no onload). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,600;12..96,700;12..96,800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!-- Ícones: só o subconjunto usado (icon_names preenchido no build a partir de src/lib/icons.ts).
         Ficam invisíveis até a fonte chegar (html.icons-ready), para não piscar o nome como texto. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=__ICON_NAMES__&display=block"
      rel="stylesheet"
      media="print"
      onerror="document.documentElement.classList.add('icons-ready')"
      onload="this.media='all';document.fonts.load('24px &quot;Material Symbols Outlined&quot;','home').finally(function(){document.documentElement.classList.add('icons-ready')})"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    </noscript>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="FORJA — sistema operacional pessoal de alta performance. Metas, treino, saúde, hábitos, foco e diário em um só lugar." />
    <meta name="robots" content="noindex, nofollow" />
    <title>FORJA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
